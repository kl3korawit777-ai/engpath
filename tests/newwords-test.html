<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>new words harness</title>
<script type="importmap">{ "imports": { "/js/db.js": "/tests/mock-db-nw.js", "../db.js": "/tests/mock-db-nw.js" } }</script>
<link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/app.css"></head>
<body><main class="main" id="view"></main><div id="toast" class="toast" hidden></div>
<script type="module">
  import { vocab } from "/js/vocab.js";
  await vocab.loadAll();
  const nw = await import("/js/views/newwords.js");
  const view = document.getElementById("view");
  const a = document.createElement("div"), b = document.createElement("div");
  view.append(a, b);
  const toast = (t) => { const el = document.getElementById("toast"); el.textContent = t; el.hidden = false; };
  nw.mount(a, { toast });
  nw.mountPlan(b, { toast });
  window.__ready = true;
</script></body></html>
