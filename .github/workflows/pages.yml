# Deploy GitHub Pages โดยเผยแพร่เฉพาะไฟล์ของแอป (ไม่รวม tools/ tests/ docs/ และไฟล์ทำงานของสคริปต์สร้างคลังคำ)
# ตั้งค่าครั้งเดียว: Settings → Pages → Source = "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (app files only)
        run: |
          mkdir _site
          cp -r index.html manifest.json sw.js css js icons vendor vocab _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
